version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    volumes:
      - ./backend:/app
    ports: 
      - "8080:8080"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  frontent:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    volumes:
      - ./frontend:/app
    ports: 
      - "3000:3000"
    command: npm run dev